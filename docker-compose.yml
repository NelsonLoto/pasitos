services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pasitos}
      POSTGRES_USER: ${DB_USER:-pasitos_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pasitos_dev_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pasitos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pasitos_dev} -d ${DB_NAME:-pasitos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pasitos_pg_data:
