version: 2
updates:
  # Los tres builds en los mismos PRs: Kotlin y kotlinx.serialization tienen que tener la misma
  # versión en los tres. El Kotlin del backend se sube a mano en el PR de Kotlin (31, P-16).
  - package-ecosystem: gradle
    directories: ['/app', '/backend', '/shared']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Argentina/Buenos_Aires
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
    labels: [app, backend, shared]
    groups:
      kotlin-ksp-hilt:
        patterns:
          - 'org.jetbrains.kotlin*'
          - 'com.google.devtools.ksp*'
          - 'com.google.dagger*'
      otras-menores-y-parches:
        patterns: ['*']
        exclude-patterns:
          - 'org.jetbrains.kotlin*'
          - 'com.google.devtools.ksp*'
          - 'com.google.dagger*'
        update-types: [minor, patch]
    # Exposed 1.x cambia los paquetes (org.jetbrains.exposed.v1…): sus versiones mayores se
    # evalúan aparte (31, P-15).
    ignore:
      - dependency-name: 'org.jetbrains.exposed*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Argentina/Buenos_Aires
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
    labels: [infra]
    groups:
      acciones-menores-y-parches:
        patterns: ['*']
        update-types: [minor, patch]
