# Actualizaciones de dependencias (01 · Stack, política de versiones). Dependabot abre los PRs
# contra develop; se aplican en PRs propios, nunca mezcladas con funcionalidad.
#
# cooldown: propone una versión recién 14 días después de publicada, para que haya tiempo de
# detectar una versión maliciosa o rota. No demora las actualizaciones de seguridad.
version: 2
updates:
  # Los tres builds de Gradle juntos: Kotlin y kotlinx.serialization tienen que tener la misma
  # versión en los tres, así que un solo PR los sube a la vez
  - package-ecosystem: gradle
    directories:
      - /app
      - /backend
      - /shared
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
    # Un grupo toma una dependencia si es el primero cuyo patrón coincide
    groups:
      # Kotlin y KSP en su propio PR: piden verificar KSP, Hilt, Room y AGP antes de subir, y si
      # se traban no frenan al resto
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp*"
      # Menores y parches de todo lo demás en un solo PR por semana. Cada versión mayor llega en
      # su propio PR, porque se evalúa aparte (por ejemplo, Exposed 1.x)
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
