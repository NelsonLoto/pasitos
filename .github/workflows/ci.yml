name: CI
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      shared: ${{ steps.paths.outputs.shared }}
      backend: ${{ steps.paths.outputs.backend }}
      android: ${{ steps.paths.outputs.android }}
      docs: ${{ steps.paths.outputs.docs }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probar controles de CI
        run: node --test .github/scripts/ci-checks.test.mjs
      - name: Detectar componentes afectados
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/ci-checks.mjs changes "$BASE_SHA" "$HEAD_SHA"

  shared:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar wrapper
        run: bash .github/scripts/check-gradle-wrapper.sh shared
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
          validate-wrappers: true
      - name: Probar shared
        working-directory: shared
        run: |
          chmod +x gradlew
          ./gradlew test --console=plain
      - name: Guardar informes si falla shared
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-reports
          path: |
            shared/build/reports/
            shared/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar wrapper
        run: bash .github/scripts/check-gradle-wrapper.sh backend
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
          validate-wrappers: true
      # Testcontainers usa el Docker del runner para levantar PostgreSQL 16.
      - name: Probar backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --console=plain
      - name: Guardar informes si falla backend
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: |
            backend/build/reports/
            backend/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar wrapper y zona horaria
        run: |
          bash .github/scripts/check-gradle-wrapper.sh app
          bash .github/scripts/check-local-date-now.sh
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
          validate-wrappers: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: robolectric
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-
      - name: Compilar, probar y ejecutar lint
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/develop' && steps.robolectric.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.cache-primary-key }}
      - name: Guardar informes si falla Android
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            app/app/build/reports/
            app/app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: pasitos-ci
      JWT_SECRET: synthetic-ci-signing-key-not-a-secret-00000000000000000000000000000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar secretos ficticios para comprobar exclusión del contexto
        run: |
          printf 'DB_PASSWORD=synthetic-ci-only\n' > backend/.env
          for module in backend shared; do
            mkdir -p "$module/src/main/resources/ci-secret-probe"
            for name in .env .env.local test.pem test.jks test.keystore; do
              printf 'synthetic-ci-only\n' > "$module/src/main/resources/ci-secret-probe/$name"
            done
          done
      - name: Construir y verificar el entorno completo
        run: |
          docker compose --profile full up -d --wait --wait-timeout 180
          curl --fail --silent http://127.0.0.1:8080/health
          node .github/scripts/check-docker-image.mjs "$(docker compose ps -q backend)"
      - name: Guardar logs si falla Docker
        if: failure()
        run: docker compose --profile full logs --no-color > docker.log 2>&1
      - name: Publicar informe si falla Docker
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-reports
          path: docker.log
          retention-days: 7
      - name: Detener entorno temporal
        if: always()
        run: docker compose --profile full down -v --remove-orphans

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar enlaces locales y anclas
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments=anchor-only --no-progress './**/*.md'
          fail: true
