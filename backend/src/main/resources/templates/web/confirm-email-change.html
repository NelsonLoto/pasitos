<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Pasitos</title>
</head>
<body style="font-family: sans-serif; color: #222; max-width: 480px; margin: 48px auto; text-align: center;">
    <h1>Pasitos</h1>
    <p th:if="${success}">Tu email se actualizó. Volvé a la app e iniciá sesión con el email nuevo.</p>
    <p th:unless="${success}">
        Ese link de confirmación venció o ya se usó. Volvé a la app y pedí el cambio de email de
        nuevo.
    </p>
</body>
</html>
