<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Pasitos</title>
</head>
<body style="font-family: sans-serif; color: #222; max-width: 480px; margin: 48px auto;">
    <h1 style="text-align:center;">Pasitos</h1>

    <div th:if="${success}" style="text-align:center;">
        <p>Tu contraseña se actualizó. Cerramos todas las sesiones abiertas por seguridad: volvé
            a la app e iniciá sesión con tu contraseña nueva.</p>
    </div>

    <div th:if="${!success and !tokenValid}" style="text-align:center;">
        <p>Ese link de recuperación venció o ya se usó. Volvé a la app y pedí uno nuevo.</p>
    </div>

    <form th:if="${!success and tokenValid}" method="post" action="/web/reset-password">
        <p th:if="${error}" th:text="${error}" style="color:#c62828;">Error</p>
        <input type="hidden" name="token" th:value="${token}"/>
        <label for="newPassword">Contraseña nueva</label><br/>
        <input id="newPassword" name="newPassword" type="password" required="required"
               minlength="8" style="width:100%; padding:8px; margin:8px 0;"/>
        <p style="font-size:0.9em; color:#555;">Al menos 8 caracteres, con letras y números.</p>
        <button type="submit" style="background:#2e7d32; color:#fff; padding:12px 20px; border:none; border-radius:4px;">
            Guardar contraseña
        </button>
    </form>
</body>
</html>
