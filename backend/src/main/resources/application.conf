ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.pasitos.backend.ApplicationKt.module ]
    }
}

db {
    host = "localhost"
    host = ${?DB_HOST}
    port = "5432"
    port = ${?DB_PORT}
    name = "pasitos"
    name = ${?DB_NAME}
    user = "pasitos_dev"
    user = ${?DB_USER}
    password = "pasitos_dev_local"
    password = ${?DB_PASSWORD}
}

jwt {
    secret = "dev-secret-change-me"
    secret = ${?JWT_SECRET}
    issuer = "pasitos-backend"
    issuer = ${?JWT_ISSUER}
    audience = "pasitos-app"
    audience = ${?JWT_AUDIENCE}
    expirationMinutes = "10080"
    expirationMinutes = ${?JWT_EXPIRATION_MINUTES}
}
