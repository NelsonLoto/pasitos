ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.pasitos.backend.ApplicationKt.module ]
    }
}

db {
    host = "localhost"
    host = ${?DB_HOST}
    port = "5432"
    port = ${?DB_PORT}
    name = "pasitos"
    name = ${?DB_NAME}
    user = "pasitos_dev"
    user = ${?DB_USER}
    password = "pasitos_dev_local"
    password = ${?DB_PASSWORD}
}

jwt {
    secret = "dev-secret-change-me"
    secret = ${?JWT_SECRET}
    issuer = "pasitos-backend"
    issuer = ${?JWT_ISSUER}
    audience = "pasitos-app"
    audience = ${?JWT_AUDIENCE}
    # El token de acceso dura 15 minutos y no se configura (ADR-11).
}

google {
    # ID del cliente web del proyecto pasitos-751c4: el `aud` que se exige en los ID tokens de
    # Google (30 · Infraestructura). No es secreto: también va dentro del APK.
    clientId = "627692337820-lao7eidv67os92k7mpqhrgoudh2belf9.apps.googleusercontent.com"
    clientId = ${?GOOGLE_CLIENT_ID}
}

terms {
    # Versión vigente de los términos y la política de privacidad (RN-CTA-02). Al cambiarla, quien
    # aceptó una versión anterior la ve como pendiente en GET /api/v1/me.
    version = "1"
    version = ${?TERMS_VERSION}
}

declaration {
    # Versión vigente de "Soy madre, padre o representante legal de este niño o niña"
    # (RF-HIJ-01, RNF-PRI-02). Sin un flujo propio para re-pedirla si cambia (a diferencia de los
    # términos, RN-CTA-02): se registra con cada alta de hijo.
    version = "1"
    version = ${?DECLARATION_VERSION}
}

mail {
    # En local y CI, Mailpit (sin usuario ni contraseña) (17 · Notificaciones y emails, ADR-07).
    smtpHost = "localhost"
    smtpHost = ${?SMTP_HOST}
    smtpPort = "1025"
    smtpPort = ${?SMTP_PORT}
    smtpUser = ""
    smtpUser = ${?SMTP_USER}
    smtpPassword = ""
    smtpPassword = ${?SMTP_PASSWORD}
    from = "no-responder@pasitos.ar"
    from = ${?MAIL_FROM}
}

public {
    # Para armar los links de los emails hacia las páginas /web/... (ADR-27).
    baseUrl = "http://localhost:8080"
    baseUrl = ${?PUBLIC_BASE_URL}
}
