# PasitosApplication inicia Hilt y WorkManager al crearse; las pruebas con Robolectric usan una
# Application vacía y arman solo lo que prueban.
application=android.app.Application
# Sin el manifest, Robolectric no conoce el targetSdk y elegiría la versión más vieja que soporta,
# por debajo del minSdk de la app. Mantener igual al targetSdk de app/build.gradle.kts.
sdk=37
